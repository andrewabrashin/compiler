version: "3.8"

services:
  codetrainer:
    build: .
    image: compiler.ru:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8192M
    environment:
      - TZ=Europe/Moscow
      - PORT=3999
      - TIMEOUT=${TIMEOUT:-60}
      - NODE_ENV=production
      - API_KEY=${API_KEY:-}
      - ADMIN_KEY=${ADMIN_KEY:-}
      - RESTART_TOKEN=${RESTART_TOKEN:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ./data/log:/log
      - ./data/src:/app:ro
      - ./data/student:/home/student
    command: node /app/launch.js
    ports:
      - "3999:3999"
