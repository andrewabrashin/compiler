<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Console Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; }

    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; background: #252526; border-bottom: 1px solid #3c3c3c;
    }
    .toolbar label { font-size: 12px; color: #9d9d9d; }
    select, input[type=text], input[type=password] {
      background: #3c3c3c; border: 1px solid #555; color: #d4d4d4;
      padding: 4px 8px; border-radius: 3px; font-family: monospace; font-size: 13px;
    }
    input[type=password] { width: 220px; }
    button {
      padding: 5px 14px; border: none; border-radius: 3px; cursor: pointer;
      font-family: monospace; font-size: 13px; font-weight: bold;
    }
    #btn-run     { background: #0e7a0e; color: #fff; }
    #btn-execute { background: #1a5c8a; color: #fff; }
    #btn-kill    { background: #a12b2b; color: #fff; display: none; }
    #btn-eof     { background: #5a3e7a; color: #fff; display: none; }
    #btn-clear   { background: #3c3c3c; color: #ccc; }

    .interactive-wrap { display: flex; align-items: center; gap: 5px; }
    .interactive-wrap input[type=checkbox] { accent-color: #569cd6; width: 14px; height: 14px; cursor: pointer; }
    .interactive-wrap label { font-size: 12px; color: #9d9d9d; cursor: pointer; user-select: none; }
    .interactive-wrap label.disabled { opacity: 0.4; }

    #status { font-size: 12px; color: #9d9d9d; margin-left: auto; }

    .main { display: flex; flex: 1; overflow: hidden; }

    .editor-pane {
      display: flex; flex-direction: column; width: 50%;
      border-right: 1px solid #3c3c3c;
    }
    .editor-pane > label { padding: 6px 10px; font-size: 11px; color: #9d9d9d; background: #252526; }
    #code {
      flex: 1; resize: none; background: #1e1e1e; color: #d4d4d4;
      border: none; outline: none; padding: 10px; font-size: 13px; line-height: 1.5;
      tab-size: 4;
    }

    .output-pane { display: flex; flex-direction: column; flex: 1; }
    .output-pane > label { padding: 6px 10px; font-size: 11px; color: #9d9d9d; background: #252526; }
    #output {
      flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-all;
    }

    .stdin-bar {
      display: flex; gap: 6px; padding: 8px 10px; align-items: flex-end;
      background: #252526; border-top: 1px solid #3c3c3c;
    }
    #stdin-input {
      flex: 1; background: #1e1e1e; border: 1px solid #555; color: #d4d4d4;
      padding: 5px 8px; font-family: monospace; font-size: 13px; border-radius: 3px;
      resize: none; overflow: hidden; min-height: 28px; max-height: 200px;
      line-height: 1.5; display: block;
    }
    #btn-send { background: #264f78; color: #fff; padding: 5px 12px; border: none; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 13px; font-weight: bold; }

    .out-stdout  { color: #d4d4d4; }
    .out-stderr  { color: #f48771; }
    .out-info    { color: #569cd6; }
    .out-exit-ok  { color: #4ec9b0; }
    .out-exit-err { color: #f48771; }
  </style>
</head>
<body>

<div class="toolbar">
  <label>Язык:</label>
  <select id="lang">
    <option value="python">Python</option>
    <option value="js">JavaScript (Node)</option>
    <option value="ts">TypeScript</option>
    <option value="cpp">C++</option>
  </select>

  <div class="interactive-wrap">
    <input type="checkbox" id="interactive" checked>
    <label for="interactive" id="interactive-label">интерактивный</label>
  </div>

  <label>Secret:</label>
  <input type="password" id="api-key" placeholder="COMPILER_SECRET">

  <button id="btn-execute">⚡ Execute</button>
  <button id="btn-run">▶ Run</button>
  <button id="btn-eof">Ctrl+D</button>
  <button id="btn-kill">■ Kill</button>
  <button id="btn-clear">Clear</button>

  <span id="status">не подключено</span>
</div>

<div class="main">
  <div class="editor-pane">
    <label>Код</label>
    <textarea id="code" spellcheck="false"></textarea>
  </div>

  <div class="output-pane">
    <label>Вывод</label>
    <div id="output"></div>
    <div class="stdin-bar">
      <textarea id="stdin-input" rows="1" placeholder="stdin → Enter отправить, Shift+Enter перенос строки" disabled></textarea>
      <button id="btn-send" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  // md5(secret.timestamp).timestamp  — mirrors Python token_validation middleware
  const md5=(d)=>{const M=(d)=>{for(var _,m="0123456789ABCDEF",f="",r=0;r<d.length;r++)_=d.charCodeAt(r),f+=m.charAt(_>>>4&15)+m.charAt(15&_);return f};const X=(d)=>{for(var _=Array(d.length>>2),m=0;m<_.length;m++)_[m]=0;for(m=0;m<8*d.length;m+=8)_[m>>5]|=(255&d.charCodeAt(m/8))<<m%32;return _};const V=(d)=>{for(var _="",m=0;m<32*d.length;m+=8)_+=String.fromCharCode(d[m>>5]>>>m%32&255);return _};const Y=(d,_)=>{d[_>>5]|=128<<_%32,d[14+(_+64>>>9<<4)]=_;for(var m=1732584193,f=-271733879,r=-1732584194,i=271733878,n=0;n<d.length;n+=16){var h=m,t=f,g=r,e=i;f=md5_ii(f=md5_ii(f=md5_ii(f=md5_ii(f=md5_hh(f=md5_hh(f=md5_hh(f=md5_hh(f=md5_gg(f=md5_gg(f=md5_gg(f=md5_gg(f=md5_ff(f=md5_ff(f=md5_ff(f=md5_ff(f,r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+0],7,-680876936),f,r,d[n+1],12,-389564586),m,f,d[n+2],17,606105819),i,m,d[n+3],22,-1044525330),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+4],7,-176418897),f,r,d[n+5],12,1200080426),m,f,d[n+6],17,-1473231341),i,m,d[n+7],22,-45705983),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+8],7,1770035416),f,r,d[n+9],12,-1958414417),m,f,d[n+10],17,-42063),i,m,d[n+11],22,-1990404162),r=md5_ff(r,i=md5_ff(i,m=md5_ff(m,f,r,i,d[n+12],7,1804603682),f,r,d[n+13],12,-40341101),m,f,d[n+14],17,-1502002290),i,m,d[n+15],22,1236535329),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+1],5,-165796510),f,r,d[n+6],9,-1069501632),m,f,d[n+11],14,643717713),i,m,d[n+0],20,-373897302),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+5],5,-701558691),f,r,d[n+10],9,38016083),m,f,d[n+15],14,-660478335),i,m,d[n+4],20,-405537848),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+9],5,568446438),f,r,d[n+14],9,-1019803690),m,f,d[n+3],14,-187363961),i,m,d[n+8],20,1163531501),r=md5_gg(r,i=md5_gg(i,m=md5_gg(m,f,r,i,d[n+13],5,-1444681467),f,r,d[n+2],9,-51403784),m,f,d[n+7],14,1735328473),i,m,d[n+12],20,-1926607734),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+5],4,-378558),f,r,d[n+8],11,-2022574463),m,f,d[n+11],16,1839030562),i,m,d[n+14],23,-35309556),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+1],4,-1530992060),f,r,d[n+4],11,1272893353),m,f,d[n+7],16,-155497632),i,m,d[n+10],23,-1094730640),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+13],4,681279174),f,r,d[n+0],11,-358537222),m,f,d[n+3],16,-722521979),i,m,d[n+6],23,76029189),r=md5_hh(r,i=md5_hh(i,m=md5_hh(m,f,r,i,d[n+9],4,-640364487),f,r,d[n+12],11,-421815835),m,f,d[n+15],16,530742520),i,m,d[n+2],23,-995338651),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+0],6,-198630844),f,r,d[n+7],10,1126891415),m,f,d[n+14],15,-1416354905),i,m,d[n+5],21,-57434055),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+12],6,1700485571),f,r,d[n+3],10,-1894986606),m,f,d[n+10],15,-1051523),i,m,d[n+1],21,-2054922799),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+8],6,1873313359),f,r,d[n+15],10,-30611744),m,f,d[n+6],15,-1560198380),i,m,d[n+13],21,1309151649),r=md5_ii(r,i=md5_ii(i,m=md5_ii(m,f,r,i,d[n+4],6,-145523070),f,r,d[n+11],10,-1120210379),m,f,d[n+2],15,718787259),i,m,d[n+9],21,-343485551),m=safe_add(m,h),f=safe_add(f,t),r=safe_add(r,g),i=safe_add(i,e)}return Array(m, f, r, i)};const md5_cmn=(d,_,m,f,r,i)=>safe_add(bit_rol(safe_add(safe_add(_,d),safe_add(f,i)),r),m);const md5_ff=(d,_,m,f,r,i,n)=>md5_cmn(_&m|~_&f,d,_,r,i,n);const md5_gg=(d,_,m,f,r,i,n)=>md5_cmn(_&f|m&~f,d,_,r,i,n);const md5_hh=(d,_,m,f,r,i,n)=>md5_cmn(_^m^f,d,_,r,i,n);const md5_ii=(d,_,m,f,r,i,n)=>md5_cmn(m^(_|~f),d,_,r,i,n);const safe_add=(d,_)=>{var m=(65535&d)+(65535&_);return(d>>16)+(_>>16)+(m>>16)<<16|65535&m;};const bit_rol=(d,_)=>d<<_|d>>>32-_;d=unescape(encodeURIComponent(d));return(M(V(Y(X(d),8*d.length)))).toLowerCase()};
  function createToken(secret) { const t = Date.now(); return `${md5(`${secret}.${t}`)}.${t}`; }

  const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/console`;

  const langSelect      = document.getElementById('lang');
  const interactiveBox  = document.getElementById('interactive');
  const interactiveLabel= document.getElementById('interactive-label');
  const apiKeyInput     = document.getElementById('api-key');
  const codeArea        = document.getElementById('code');
  const output          = document.getElementById('output');
  const stdinInput      = document.getElementById('stdin-input');
  const btnRun          = document.getElementById('btn-run');
  const btnKill         = document.getElementById('btn-kill');
  const btnEof          = document.getElementById('btn-eof');
  const btnClear        = document.getElementById('btn-clear');
  const btnExecute      = document.getElementById('btn-execute');
  const btnSend         = document.getElementById('btn-send');
  const statusEl        = document.getElementById('status');

  const EXAMPLES = {
    python: `def greet(name):\n    print(f"Привет, {name}!")\n\ndef square(n):\n    return n * n\n\nprint("Функции загружены: greet(name), square(n)")`,
    js:     `const readline = require('readline');\nconst rl = readline.createInterface({ input: process.stdin });\nrl.question('Введите имя: ', name => {\n  console.log(\`Привет, \${name}!\`);\n  rl.close();\n});`,
    ts:     `import * as readline from 'readline';\nconst rl = readline.createInterface({ input: process.stdin });\nrl.question('Введите имя: ', (name: string) => {\n  console.log(\`Привет, \${name}!\`);\n  rl.close();\n});`,
    cpp:    `#include <iostream>\n#include <string>\nint main() {\n    std::string name;\n    std::cout << "Введите имя: ";\n    std::getline(std::cin, name);\n    std::cout << "Привет, " << name << "!" << std::endl;\n    return 0;\n}`,
  };

  // Python и JS поддерживают интерактивный режим
  const INTERACTIVE_COMMAND = {
    python: (file) => `python -i "${file}"`,
    js:     (file) => `node -i --require ./${file}`,
    ts:     null,
    cpp:    null,
  };

  const FILE_NAMES = { python: 'main.py', js: 'main.js', ts: 'main.ts', cpp: 'main.cpp' };

  function updateInteractiveToggle() {
    const lang = langSelect.value;
    const supported = !!INTERACTIVE_COMMAND[lang];
    interactiveBox.disabled = !supported;
    interactiveLabel.classList.toggle('disabled', !supported);
    if (!supported) interactiveBox.checked = false;
    else interactiveBox.checked = true;
  }

  langSelect.addEventListener('change', () => {
    codeArea.value = EXAMPLES[langSelect.value];
    updateInteractiveToggle();
  });

  // init
  codeArea.value = EXAMPLES[langSelect.value];
  updateInteractiveToggle();

  let ws = null;
  let startTime = null;

  function log(text, cls) {
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = text;
    output.appendChild(span);
    output.scrollTop = output.scrollHeight;
  }

  function setRunning(running) {
    const interactive = interactiveBox.checked;
    btnRun.style.display  = running ? 'none' : '';
    btnKill.style.display = running ? '' : 'none';
    btnEof.style.display  = running && interactive ? '' : 'none';
    stdinInput.disabled = !running;
    btnSend.disabled    = !running;
    if (!running) stdinInput.value = '';
  }

  function sendStdin() {
    const text = stdinInput.value;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    // Multi-line blocks need a trailing empty line to close the compound statement
    const data = text.includes('\n') ? text + '\n\n' : text + '\n';
    ws.send(JSON.stringify({ type: 'stdin', data }));
    log(text + '\n', 'out-info');
    stdinInput.value = '';
    stdinInput.style.height = 'auto';
    stdinInput.focus();
  }

  function growStdin() {
    stdinInput.style.height = 'auto';
    stdinInput.style.height = Math.min(stdinInput.scrollHeight, 200) + 'px';
  }

  stdinInput.addEventListener('input', growStdin);

  stdinInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendStdin();
    } else if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      const s = stdinInput.selectionStart;
      const before = stdinInput.value.slice(0, s);
      const curLine = before.slice(before.lastIndexOf('\n') + 1);
      const indent = curLine.match(/^(\s*)/)[1];
      const extra = curLine.trimEnd().endsWith(':') ? '    ' : '';
      const ins = '\n' + indent + extra;
      stdinInput.value = before + ins + stdinInput.value.slice(stdinInput.selectionEnd);
      stdinInput.selectionStart = stdinInput.selectionEnd = s + ins.length;
      growStdin();
    }
  });
  btnSend.addEventListener('click', sendStdin);

  codeArea.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = codeArea.selectionStart;
      codeArea.value = codeArea.value.slice(0, s) + '    ' + codeArea.value.slice(codeArea.selectionEnd);
      codeArea.selectionStart = codeArea.selectionEnd = s + 4;
    }
  });

  btnClear.addEventListener('click', () => { output.innerHTML = ''; });

  btnKill.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'kill' }));
    }
  });

  btnEof.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'eof' }));
      log('[Ctrl+D]\n', 'out-info');
    }
  });

  btnExecute.addEventListener('click', async () => {
    const lang    = langSelect.value;
    const apiKey  = apiKeyInput.value.trim();
    const file    = FILE_NAMES[lang];

    log(`⚡ Execute (${lang})...\n`, 'out-info');
    btnExecute.disabled = true;
    statusEl.textContent = 'выполняется';

    const headers = { 'Content-Type': 'application/json' };
    if (apiKey) headers['Authorization'] = `Bearer ${createToken(apiKey)}`;

    try {
      const res = await fetch('/execute', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          compiler: lang,
          target_file: file,
          files: [{ name: file, content: codeArea.value }],
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        log(`Ошибка ${res.status}: ${data.error ?? JSON.stringify(data)}\n`, 'out-stderr');
      } else {
        const run = data.run;
        if (run.stdout) log(run.stdout, 'out-stdout');
        if (run.stderr) log(run.stderr, 'out-stderr');
        const ok = run.exit_code === 0;
        log(`\n${ok ? '✓' : '✗'} Завершено: код ${run.exit_code}, время ${run.duration} мс\n`,
            ok ? 'out-exit-ok' : 'out-exit-err');
      }
    } catch (e) {
      log(`Ошибка запроса: ${e.message}\n`, 'out-stderr');
    }

    btnExecute.disabled = false;
    statusEl.textContent = 'не подключено';
  });

  btnRun.addEventListener('click', () => {
    if (ws) { ws.close(); ws = null; }

    const lang        = langSelect.value;
    const interactive = interactiveBox.checked;
    const secret      = apiKeyInput.value.trim();
    const file        = FILE_NAMES[lang];

    log(`▶ Подключение...\n`, 'out-info');
    statusEl.textContent = 'подключение...';

    try {
      const wsUrl = secret ? `${WS_URL}?token=${createToken(secret)}` : WS_URL;
      ws = new WebSocket(wsUrl);
    } catch (e) {
      log(`Ошибка: ${e.message}\n`, 'out-stderr');
      return;
    }

    ws.onopen = () => {
      startTime = Date.now();
      statusEl.textContent = 'выполняется';
      setRunning(true);

      const msg = {
        type: 'start',
        compiler: lang,
        files: [{ name: file, content: codeArea.value }],
      };

      if (interactive && INTERACTIVE_COMMAND[lang]) {
        msg.command = INTERACTIVE_COMMAND[lang](file);
        msg.interactive = true;
        log(`▶ Запуск (${lang}, интерактивный)\n`, 'out-info');
      } else {
        msg.target_file = file;
        log(`▶ Запуск (${lang})\n`, 'out-info');
      }

      ws.send(JSON.stringify(msg));
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'stdout') {
        log(msg.data, 'out-stdout');
      } else if (msg.type === 'stderr') {
        log(msg.data, 'out-stderr');
      } else if (msg.type === 'exit') {
        const dur = msg.duration ?? (Date.now() - startTime);
        if (msg.code === 0) {
          log(`\n✓ Завершено: код 0, время ${dur} мс\n`, 'out-exit-ok');
        } else {
          log(`\n✗ Завершено: код ${msg.code}, время ${dur} мс\n`, 'out-exit-err');
        }
        setRunning(false);
        statusEl.textContent = `завершено (${msg.code})`;
        ws.close();
      } else if (msg.type === 'error') {
        log(`Ошибка: ${msg.message}\n`, 'out-stderr');
        setRunning(false);
        statusEl.textContent = 'ошибка';
      }
    };

    ws.onerror = () => {
      log('WebSocket ошибка соединения\n', 'out-stderr');
      setRunning(false);
      statusEl.textContent = 'ошибка';
    };

    ws.onclose = (e) => {
      if (e.code !== 1000 && e.code !== 1005) {
        log(`Соединение закрыто (${e.code})\n`, 'out-stderr');
      }
      setRunning(false);
      statusEl.textContent = 'не подключено';
      ws = null;
    };
  });
</script>
</body>
</html>
