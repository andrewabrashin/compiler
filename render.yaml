services:
  - type: web
    name: compiler-1
    runtime: docker
    dockerfilePath: ./render/Dockerfile.slim
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEOUT
        value: "60"
      - key: INTERACTIVE_TIMEOUT
        value: "600"
      - key: MAX_SESSIONS
        value: "20"
      - key: MAX_SESSIONS_PER_IP
        value: "3"
      - key: WS_RATE_MAX
        value: "10"
      - key: API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: RESTART_TOKEN
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
