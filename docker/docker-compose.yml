version: "3.8"

services:
  codetrainer:
    build: .
    image: compiler.ru:latest
    restart: always
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8192M
    environment:
      - TZ=Europe/Moscow
      - PORT=3999
      - TIMEOUT=${TIMEOUT:-60}
      - MAX_MEMORY_MB=512
      - NODE_ENV=development
      - COMPILER_SECRET=${COMPILER_SECRET:-}
    env_file:
      - .env
    volumes:
      - ../data/log:/log
      - ../src:/app:ro
      - ../data/student:/home/student
    command: bash -c "chmod -R o-rwx /app 2>/dev/null || true && node /app/launch.js"
    ports:
      - "3999:3999"
